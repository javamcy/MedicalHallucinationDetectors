[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "benchaudit"
version = "0.1.0"
description = "Screen a vision-language benchmark for evaluation-protocol sensitivity without training a model on the images"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "scikit-learn>=1.1"]

[project.scripts]
benchaudit = "benchaudit.cli:main"

[tool.setuptools.packages.find]
include = ["benchaudit*"]
